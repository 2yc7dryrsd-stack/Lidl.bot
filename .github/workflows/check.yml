name: Lidl Kontrol
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - run: |
          python -c "
          import os, requests
          token=os.getenv('TELEGRAM_TOKEN')
          chat=os.getenv('CHAT_ID')
          print(f'Chat: {chat}')
          r=requests.get(f'https://api.telegram.org/bot{token}/getMe', timeout=10)
          print('BOT BILGI:', r.text)
          r2=requests.post(f'https://api.telegram.org/bot{token}/sendMessage', json={'chat_id': chat, 'text': '✅ SONUNDA CALISTI! Lante bot baglandi'}, timeout=15)
          print(f'SEND {r2.status_code}: {r2.text}')
          "
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
