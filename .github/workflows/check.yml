name: Lidl Kontrol
on:
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * *'
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install requests
      - name: Test Telegram
        run: |
          python -c "
          import os, requests
          token = os.getenv('TELEGRAM_TOKEN')
          chat = os.getenv('CHAT_ID')
          print(f'Token uzunluk: {len(token) if token else 0}')
          print(f'Chat ID: {chat}')
          url = f'https://api.telegram.org/bot{token}/getMe'
          print(requests.get(url, timeout=10).text)
          url2 = f'https://api.telegram.org/bot{token}/sendMessage'
          r = requests.post(url2, json={'chat_id': chat, 'text': '✅ TEST - Lante calisti!'}, timeout=15)
          print(f'SEND Status: {r.status_code}')
          print(f'SEND Response: {r.text}')
          "
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
